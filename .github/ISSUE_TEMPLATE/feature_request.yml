name: Feature request
description: Propose a change to what something does.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What you are trying to do, and where the current behaviour gets in the
        way. Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: >
        The change, concretely — the flag, the config key, the output. If it
        touches an interface or what gets paid out, sketch the before and after.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else would solve this, and why this is better.

  - type: checkboxes
    id: breaking
    attributes:
      label: Impact
      options:
        - label: This would change existing behaviour, output, or amounts
        - label: I am willing to implement this
