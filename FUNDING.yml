# Where the "Sponsor" button on every dedalo-org repository points.
#
# This is an organisation default: it applies to every repository that ships no
# FUNDING.yml of its own, which today is all of them. A repository's own file
# always wins, so a project that ever needs its own destination adds one there
# rather than editing this.
#
# At the repository root, beside the other org-wide defaults. GitHub looks in
# `.github/`, then the root, then `docs/`, so either of the first two works;
# the root is where CODE_OF_CONDUCT, CONTRIBUTING, SECURITY and SUPPORT already
# live, and `.github/` here holds templates, which are a different thing.
#
# This file is necessary and not sufficient. The Sponsor button also needs the
# repository's **Sponsorships** feature switched on, per repository, under
# Settings → General → Features. It is off by default across this organisation
# — `showSponsorButton` is false on every repository page — it is not exposed
# by the REST API, and no FUNDING.yml overrides it. Until somebody ticks that
# box, this file is correct and invisible.
#
# The slug is the same one `dedalo.toml` names under `[project]
# open_collective`, and the same collective the protocol fee is designed to
# flow to. Keeping them one string is deliberate: a project about funding open
# source that is funded somewhere other than where it says would be its own
# kind of bug.
#
# https://opencollective.com/dedalo
open_collective: dedalo
